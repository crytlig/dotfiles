# AeroSpace config (v0.21.x) — https://nikitabobko.github.io/AeroSpace
#
# Mod = Option(⌥) + Command(⌘)  ->  written as `alt-cmd-` in AeroSpace syntax.
#
# Why ⌥⌘ and not something else:
#   - Freaking herdr owns plain ⌥+hjkl
#   - ⌘ alone collides with every app shortcut (⌘1 = tabs, ⌘L = address bar, ⌘H = hide...)
#   - ⌃ alone collides with terminal line editing (⌃H = backspace, ⌃J = newline = hjkl keys)
#   - ⌥⌘ is a comfortable thumb-chord on a Mac keyboard and is otherwise unused by macOS
#
config-version = 2

# Hot-reload the config on every save (after the first manual reload-config)
auto-reload-config = true

# Start at login. Also toggleable from the AeroSpace menu bar icon.
start-at-login = true

after-startup-command = []

# Undo accidental ⌘H "Hide". AeroSpace resurrects the hidden app.
automatically-unhide-macos-hidden-apps = true

# Multi-monitor nicety: move the mouse when the focused workspace moves to another monitor
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# Workspaces that stay alive when empty (these back the sketchybar workspace icons)
persistent-workspaces = ['1', '2', '3', '4', '5', '6']

# Keep sketchybar's workspace icons in sync.
# NOTE: the array is an argv list ([program, args...]), not a shell string.
# quote shell features (env var substitution) via /bin/bash -c
exec-on-workspace-change = ['/bin/bash', '-c',
    'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE']

# Tiling defaults (niri-ish feel)
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'   # wide monitor => horizontal split

# Gaps. outer.top clears the 40px sketchybar bar (40 + 4 of air)
[gaps]
inner.horizontal = 10
inner.vertical = 10
outer.left = 2
outer.bottom = 0
outer.top = 41
outer.right = 2

# Example window rule: don't tile the Calculator
[[on-window-detected]]
if.app-id = 'com.apple.calculator'
run = 'layout floating'

[mode.main.binding]

    # --- Apps ---
    alt-cmd-space = 'exec-and-forget open -a Spotlight'   # launcher; swap to `open -a Raycast` if you use it
    alt-cmd-t = 'exec-and-forget open -na Ghostty'        # terminal (new window)

    # --- Focus (niri Mod+hjkl). Note: this steals ⌥⌘H ("Hide Others") ---
    alt-cmd-h = 'focus left'
    alt-cmd-j = 'focus down'
    alt-cmd-k = 'focus up'
    alt-cmd-l = 'focus right'

    # --- Move window (niri Mod+Ctrl+hjkl) ---
    alt-cmd-shift-h = 'move left'
    alt-cmd-shift-j = 'move down'
    alt-cmd-shift-k = 'move up'
    alt-cmd-shift-l = 'move right'

    # --- Resize focused window ---
    alt-cmd-minus = 'resize smart -50'
    alt-cmd-equal = 'resize smart +50'

    # --- Layout toggle ---
    # ⌥⌘[ tiles, ⌥⌘] accordion (i3-style)
    alt-cmd-leftSquareBracket = 'layout tiles horizontal vertical'
    alt-cmd-comma = 'layout accordion horizontal vertical'

    # --- Fullscreen (AeroSpace style: fills monitor, gaps off, toggles) ---
    alt-cmd-f = 'fullscreen'

    # --- Switch workspace (niri Mod+1..9) ---
    # Copy a line to add more (up to 9); keep persistent-workspaces in sync
    alt-cmd-1 = 'workspace 1'
    alt-cmd-2 = 'workspace 2'
    alt-cmd-3 = 'workspace 3'
    alt-cmd-4 = 'workspace 4'
    alt-cmd-5 = 'workspace 5'
    alt-cmd-6 = 'workspace 6'

    # --- Move window to workspace (niri Mod+Ctrl+1..9) ---
    alt-cmd-shift-1 = 'move-node-to-workspace 1'
    alt-cmd-shift-2 = 'move-node-to-workspace 2'
    alt-cmd-shift-3 = 'move-node-to-workspace 3'
    alt-cmd-shift-4 = 'move-node-to-workspace 4'
    alt-cmd-shift-5 = 'move-node-to-workspace 5'
    alt-cmd-shift-6 = 'move-node-to-workspace 6'

    # --- Cycle workspaces (niri Mod+u / Mod+i) ---
    alt-cmd-u = 'workspace --wrap-around prev'
    alt-cmd-i = 'workspace --wrap-around next'
    alt-cmd-shift-u = 'move-node-to-workspace --wrap-around prev'
    alt-cmd-shift-i = 'move-node-to-workspace --wrap-around next'

    # Multi-monitor later: uncomment + add a line, e.g.
    # alt-cmd-ctrl-h = 'focus-monitor left'

    # --- Service mode (maintenance; esc to leave) ---
    alt-cmd-semicolon = 'mode service'

[mode.service.binding]
    esc = ['reload-config', 'mode main']
    r = ['flatten-workspace-tree', 'mode main']          
    f = ['layout floating tiling', 'mode main']          # float/unfloat focused window
    backspace = ['close-all-windows-but-current', 'mode main']
